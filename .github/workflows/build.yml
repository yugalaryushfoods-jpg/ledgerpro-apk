name: Build LedgerPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ledger_url:
        description: "Cloudflare Ledger URL (Optional - e.g. https://your-app.workers.dev)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Signed LedgerPro Release APK
        env:
          INPUT_URL: ${{ github.event.inputs.ledger_url }}
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.7/bin:$PATH"

          if [ -f "ledgerpro-android-src.zip" ]; then
            rm -rf android_build
            unzip -q ledgerpro-android-src.zip -d android_build
            cd android_build
          fi

          gradle assembleRelease --no-daemon -PLEDGER_URL="$INPUT_URL"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist/LedgerPro-v4.0-Official.apk"

      - name: Save APK in Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerPro-Official-APK
          path: dist/LedgerPro-v4.0-Official.apk

      - name: Publish Direct Download APK Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "LedgerPro Official Android App (v4.0)"
          body: "Tap **LedgerPro-v4.0-Official.apk** below under Assets to download & install directly on your Android phone."
          files: dist/LedgerPro-v4.0-Official.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
